<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Juragan Warung Madura - Big Avatar Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            touch-action: none;
            user-select: none;
        }

        .title-font { font-family: 'Fredoka One', cursive; }

        #game-container {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            position: relative;
            background: radial-gradient(circle at center, #d97736 0%, #8b4513 100%);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .shelf-bg {
            background: linear-gradient(to bottom, #8b5a2b, #5c3a21);
            border-top: 8px solid #4a2810;
        }

        /* Animations */
        @keyframes popIn {
            0% { transform: scale(0) translateY(50px); opacity: 0; }
            70% { transform: scale(1.05) translateY(-5px); opacity: 1; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        .animate-pop-in { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-80px) scale(1.5); opacity: 0; }
        }
        .floating-text {
            position: absolute;
            color: #4ade80;
            font-weight: bold;
            font-size: 2.5rem;
            text-shadow: 2px 2px 0 #000;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
            z-index: 60;
        }

        .glass-panel {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
        }

        .item-btn {
            transition: transform 0.1s;
        }
        .item-btn:active {
            transform: scale(0.9);
            filter: brightness(0.8);
        }

        /* Speech Bubble Tail */
        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 12px 12px 0;
            border-style: solid;
            border-color: white transparent transparent transparent;
            display: block;
            width: 0;
        }
    </style>
</head>
<body>

    <div id="game-container">
        
        <!-- Audio BGM -->
        <audio id="bgm" loop>
            <source src="audio/lagu_game.mp3" type="audio/mpeg">
        </audio>

        <!-- START SCREEN -->
        <div id="start-screen" class="absolute inset-0 z-50 flex flex-col items-center justify-center glass-panel p-4">
            <h1 class="title-font text-5xl md:text-6xl text-yellow-400 text-center drop-shadow-[0_4px_4px_rgba(0,0,0,0.8)] mb-1">JURAGAN</h1>
            <h1 class="title-font text-4xl md:text-5xl text-white text-center drop-shadow-[0_4px_4px_rgba(0,0,0,0.8)] mb-6">WARUNG MADURA</h1>
            <div class="text-6xl mb-8 animate-bounce">🏪</div>

            <button onclick="startGame()" class="bg-green-500 hover:bg-green-400 text-white title-font text-2xl py-4 px-10 rounded-full shadow-[0_6px_0_#166534] active:shadow-[0_0px_0_#166534] active:translate-y-2 transition-all">
                BUKA WARUNG
            </button>
            <p class="text-gray-300 mt-6 text-xs text-center">Maksimal 5 pelanggan mengantre!<br>Jangan sampai ada yang kabur karena kelamaan.</p>
        </div>

        <!-- GAME OVER SCREEN -->
        <div id="game-over-screen" class="absolute inset-0 z-50 hidden flex-col items-center justify-center glass-panel">
            <h1 class="title-font text-5xl text-red-500 drop-shadow-[0_4px_4px_rgba(0,0,0,0.8)] mb-2">WARUNG TUTUP!</h1>
            <p class="text-gray-300 text-sm mb-4">Pelanggan Marah Kabur Berjamaah</p>
            <p class="text-white text-lg mb-1">Total Pendapatan:</p>
            <div class="text-5xl title-font text-yellow-400 mb-8 drop-shadow-[0_2px_2px_rgba(0,0,0,0.8)]">Rp <span id="final-score">0</span></div>
            <button onclick="startGame()" class="bg-yellow-500 hover:bg-yellow-400 text-white title-font text-2xl py-4 px-10 rounded-full shadow-[0_6px_0_#ca8a04] active:shadow-[0_0px_0_#ca8a04] active:translate-y-2 transition-all">
                BUKA LAGI
            </button>
        </div>

        <!-- GAME UI -->
        <!-- HUD Layer -->
        <div class="h-[12%] w-full flex justify-between items-center px-4 z-10 pt-2">
            <div class="bg-black/60 px-4 py-1.5 rounded-full border border-yellow-500/50 shadow-md">
                <span class="text-yellow-400 text-lg md:text-xl font-bold title-font">Rp <span id="score">0</span></span>
            </div>
            <!-- Health / Lives -->
            <div class="bg-black/60 px-3 py-1.5 rounded-full border border-red-500/50 flex gap-1 text-xl" id="lives-container">
                ❤️ ❤️ ❤️
            </div>
        </div>

        <!-- Queue Area (Top Half) -->
        <div class="h-[43%] w-full relative flex items-end justify-center pb-2 px-2">
            <!-- 5 Customer Slots Container -->
            <div id="queue-container" class="w-full max-w-4xl h-full flex items-end justify-around z-20 relative">
                <!-- Customers rendered here -->
            </div>

            <!-- Counter Desk -->
            <div class="absolute bottom-0 w-full h-6 bg-[#4a2810] border-t-4 border-[#361c0a] z-30 shadow-[0_-5px_15px_rgba(0,0,0,0.4)]"></div>
        </div>

        <!-- Inventory / Shelf Area (Bottom Half) -->
        <div class="h-[45%] w-full shelf-bg z-40 p-3 flex flex-col justify-center shadow-[0_-10px_20px_rgba(0,0,0,0.5)]">
            <div id="inventory-grid" class="grid grid-cols-4 grid-rows-2 gap-2 md:gap-3 h-full">
                <!-- Items injected via JS -->
            </div>
        </div>
    </div>

    <script>
        // =========================================================================
        // 🖼️ MASUKKIN LINK GAMBAR PELANGGAN LU DI SINI, BRE!
        // =========================================================================
        const CUSTOM_IMAGE_URLS = [
            "images/windah_gambar.png",
            "images/robby_gambar.png",
            "images/bahlil_gambar.png",
            "images/epstein_gambar.png",
            "images/mansur_gambar.png",
            "images/patrick_gambar.png",
            "images/gibran_gambar.png",
        ];

        // Game Configuration & Data
        const ITEMS = [
            { id: 'beras', emoji: '🍚', name: 'Beras' },
            { id: 'telor', emoji: '🥚', name: 'Telor' },
            { id: 'minyak', emoji: '🧴', name: 'Minyak' },
            { id: 'kopi', emoji: '☕', name: 'Kopi' },
            { id: 'mie', emoji: '🍜', name: 'Mie' },
            { id: 'gula', emoji: '🧂', name: 'Gula' },
            { id: 'sabun', emoji: '🧼', name: 'Sabun' },
            { id: 'gas', emoji: '🛢️', name: 'Gas' }
        ];

        const DEFAULT_CUSTOMERS = ['👨', '👩', '👴', '👵', '👮', '👷', '🧑‍🎓', '🕵️‍♂️'];

        // Game State
        let score = 0;
        let lives = 3;
        let queue = [];
        const MAX_QUEUE_SIZE = 5;
        let gameInterval;
        let spawnInterval;
        let isPlaying = false;

        // DOM Elements
        const elStartScreen = document.getElementById('start-screen');
        const elGameOverScreen = document.getElementById('game-over-screen');
        const elScore = document.getElementById('score');
        const elFinalScore = document.getElementById('final-score');
        const elLivesContainer = document.getElementById('lives-container');
        const elQueueContainer = document.getElementById('queue-container');
        const elInventoryGrid = document.getElementById('inventory-grid');
        const bgm = document.getElementById('bgm');

        // Audio Context Setup
        let audioCtx;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playCoinSFX() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1000, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(2000, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        function playWrongSFX() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.25);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.25);
        }

        function playClickSFX() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        }

        function renderInventory() {
            elInventoryGrid.innerHTML = '';
            ITEMS.forEach(item => {
                const btn = document.createElement('button');
                btn.className = 'item-btn bg-[#fcd34d] border-b-4 border-[#d97706] rounded-xl flex flex-col items-center justify-center shadow-lg active:border-b-0 active:mt-1 p-1';
                btn.innerHTML = `
                    <span class="text-3xl md:text-5xl drop-shadow-md pointer-events-none">${item.emoji}</span>
                    <span class="text-[10px] md:text-xs font-bold text-amber-900 mt-0.5 pointer-events-none title-font">${item.name}</span>
                `;
                btn.addEventListener('touchstart', (e) => { e.preventDefault(); handleItemSelect(item.id, e); }, {passive: false});
                btn.addEventListener('mousedown', (e) => handleItemSelect(item.id, e));
                elInventoryGrid.appendChild(btn);
            });
        }

        function generateOrders() {
            const numItems = Math.floor(Math.random() * 3) + 1;
            const orders = [];
            for (let i = 0; i < numItems; i++) {
                const randomItem = ITEMS[Math.floor(Math.random() * ITEMS.length)];
                orders.push({
                    itemId: randomItem.id,
                    emoji: randomItem.emoji,
                    fulfilled: false
                });
            }
            return orders;
        }

        function spawnCustomer() {
            if (queue.length >= MAX_QUEUE_SIZE) return;

            let avatarHtml = '';
            // Gedein ukuran gambar & emoji pelanggan di sini 🚀
            if (CUSTOM_IMAGE_URLS && CUSTOM_IMAGE_URLS.length > 0) {
                const randomImg = CUSTOM_IMAGE_URLS[Math.floor(Math.random() * CUSTOM_IMAGE_URLS.length)];
                avatarHtml = `<img src="${randomImg}" class="w-24 h-24 sm:w-28 sm:h-28 md:w-36 md:h-36 object-contain drop-shadow-2xl">`;
            } else {
                const randomEmoji = DEFAULT_CUSTOMERS[Math.floor(Math.random() * DEFAULT_CUSTOMERS.length)];
                avatarHtml = `<span class="text-7xl sm:text-8xl md:text-9xl drop-shadow-2xl">${randomEmoji}</span>`;
            }

            const customerId = 'cust_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
            const customer = {
                id: customerId,
                avatarHtml: avatarHtml,
                orders: generateOrders(),
                patience: 100,
                patienceRate: 0.15 + (Math.random() * 0.1)
            };

            queue.push(customer);
            rebuildQueueDOM();
        }

        function rebuildQueueDOM() {
            elQueueContainer.innerHTML = '';

            queue.forEach((customer, index) => {
                const isFront = index === 0;
                const slot = document.createElement('div');
                slot.id = customer.id;
                slot.className = `relative flex flex-col items-center transition-all duration-300 animate-pop-in ${isFront ? 'scale-110 z-30' : 'opacity-85 scale-95 z-20'}`;

                // Gedein emoji pesanan di dalam bubble chat 🍚🥚☕
                let ordersHtml = customer.orders.map(ord => 
                    `<span class="text-2xl sm:text-3xl md:text-4xl ${ord.fulfilled ? 'opacity-30 grayscale' : 'drop-shadow-md'}">${ord.emoji}${ord.fulfilled ? '✅' : ''}</span>`
                ).join(' ');

                slot.innerHTML = `
                    <!-- Speech Bubble (Gede & Jelas) -->
                    <div class="speech-bubble bg-white rounded-2xl px-3 py-1.5 absolute -top-16 sm:-top-20 shadow-2xl flex gap-1.5 items-center border-2 border-amber-300 order-box z-40">
                        ${ordersHtml}
                    </div>

                    <!-- Patience Bar (Lebih Lebar) -->
                    <div class="w-16 sm:w-20 md:w-28 h-2.5 bg-gray-900 rounded-full overflow-hidden mb-1 border-2 border-gray-700 shadow-md">
                        <div class="patience-bar-inner h-full bg-green-500 transition-all duration-100 origin-left" style="width: ${customer.patience}%"></div>
                    </div>

                    <!-- Avatar Container -->
                    <div class="customer-avatar flex items-center justify-center ${isFront ? 'ring-4 ring-yellow-400 rounded-2xl p-1 bg-amber-900/40 shadow-xl' : ''}">
                        ${customer.avatarHtml}
                    </div>

                    <!-- Front indicator -->
                    ${isFront ? '<span class="text-[10px] md:text-xs bg-yellow-400 text-black font-bold px-2 py-0.5 rounded-full mt-1 title-font shadow-md">GILIRAN!</span>' : ''}
                `;

                elQueueContainer.appendChild(slot);
            });
        }

        function updatePatienceBarsDOM() {
            queue.forEach((customer) => {
                const customerNode = document.getElementById(customer.id);
                if (customerNode) {
                    const barInner = customerNode.querySelector('.patience-bar-inner');
                    if (barInner) {
                        barInner.style.width = `${Math.max(0, customer.patience)}%`;
                        
                        if (customer.patience < 30) {
                            barInner.className = 'patience-bar-inner h-full bg-red-500 transition-all duration-100 origin-left';
                        } else if (customer.patience < 60) {
                            barInner.className = 'patience-bar-inner h-full bg-yellow-400 transition-all duration-100 origin-left';
                        } else {
                            barInner.className = 'patience-bar-inner h-full bg-green-500 transition-all duration-100 origin-left';
                        }
                    }
                }
            });
        }

        function createFloatingText(x, y, text) {
            const el = document.createElement('div');
            el.className = 'floating-text';
            el.innerText = text;
            el.style.left = `${x - 20}px`;
            el.style.top = `${y - 40}px`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1000);
        }

        function handleItemSelect(itemId, event) {
            if (!isPlaying || queue.length === 0) return;

            let clientX = event.clientX;
            let clientY = event.clientY;
            if (event.touches && event.touches.length > 0) {
                clientX = event.touches[0].clientX;
                clientY = event.touches[0].clientY;
            }

            const activeCustomer = queue[0];
            const unfulfilledOrder = activeCustomer.orders.find(o => o.itemId === itemId && !o.fulfilled);

            if (unfulfilledOrder) {
                playCoinSFX();
                unfulfilledOrder.fulfilled = true;

                const isAllComplete = activeCustomer.orders.every(o => o.fulfilled);

                if (isAllComplete) {
                    score += activeCustomer.orders.length * 100;
                    elScore.innerText = score.toLocaleString('id-ID');
                    createFloatingText(clientX, clientY, `+${activeCustomer.orders.length * 100}`);
                    
                    queue.shift();
                    rebuildQueueDOM();
                } else {
                    playClickSFX();
                    rebuildQueueDOM();
                }
            } else {
                playWrongSFX();
                activeCustomer.patience = Math.max(0, activeCustomer.patience - 15);
                updatePatienceBarsDOM();

                const bg = document.getElementById('game-container');
                bg.style.background = 'radial-gradient(circle at center, #ef4444 0%, #7f1d1d 100%)';
                setTimeout(() => {
                    bg.style.background = 'radial-gradient(circle at center, #d97736 0%, #8b4513 100%)';
                }, 150);
            }
        }

        function updateGameLoop() {
            if (!isPlaying) return;

            let queueChanged = false;

            for (let i = queue.length - 1; i >= 0; i--) {
                queue[i].patience -= queue[i].patienceRate;

                if (queue[i].patience <= 0) {
                    queue.splice(i, 1);
                    lives--;
                    updateLivesDisplay();
                    playWrongSFX();
                    queueChanged = true;

                    if (lives <= 0) {
                        endGame();
                        return;
                    }
                }
            }

            if (queueChanged) {
                rebuildQueueDOM();
            } else {
                updatePatienceBarsDOM();
            }
        }

        function updateLivesDisplay() {
            let hearts = '';
            for (let i = 0; i < lives; i++) hearts += '❤️ ';
            for (let i = lives; i < 3; i++) hearts += '🖤 ';
            elLivesContainer.innerText = hearts.trim();
        }

        function startGame() {
            initAudio();
            playClickSFX();

            bgm.volume = 0.3;
            bgm.play().catch(() => console.log("BGM autoplay blocked"));

            score = 0;
            lives = 3;
            queue = [];
            isPlaying = true;

            elScore.innerText = '0';
            updateLivesDisplay();

            elStartScreen.classList.add('hidden');
            elGameOverScreen.classList.add('hidden');

            renderInventory();

            spawnCustomer();
            spawnCustomer();

            if (gameInterval) clearInterval(gameInterval);
            if (spawnInterval) clearInterval(spawnInterval);

            gameInterval = setInterval(updateGameLoop, 100);
            spawnInterval = setInterval(spawnCustomer, 3500);
        }

        function endGame() {
            isPlaying = false;
            clearInterval(gameInterval);
            clearInterval(spawnInterval);

            bgm.pause();
            bgm.currentTime = 0;

            elFinalScore.innerText = score.toLocaleString('id-ID');
            elGameOverScreen.classList.remove('hidden');
            elGameOverScreen.classList.add('flex');

            playWrongSFX();
        }

        window.onload = () => {
            renderInventory();
        }
    </script>
</body>
</html>
